name: Auto Quant Layer Search

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '模型下载URL (HuggingFace ID)'
        required: true
        default: 'tencent/Hy-MT2-1.8B'
      n_samples:
        description: '校准样本数'
        required: true
        default: '24'
      seq_len:
        description: '校准序列长度'
        required: true
        default: '128'
      block:
        description: '权重分块 (blkN)'
        required: true
        default: '64'
      modes:
        description: '探测模式 (w4a8,w4a16,w8a8,all_w4a8,all_w8a8)'
        required: true
        default: 'w4a8,w4a16,w8a8,all_w4a8,all_w8a8'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install transformers accelerate numpy sentencepiece protobuf

    - name: Download model
      env:
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        MODEL_URL: ${{ github.event.inputs.model_url }}
      run: |
        set -eo pipefail
        mkdir -p ${{ github.workspace }}/models
        cd ${{ github.workspace }}/models
        MODEL_NAME=$(echo "$MODEL_URL" | sed 's/[\/]/_/g')
        echo "MODEL_NAME=${MODEL_NAME}" >> $GITHUB_ENV
        if [ -n "$HF_TOKEN" ]; then
          git clone --depth 1 "https://oauth2:${HF_TOKEN}@huggingface.co/$MODEL_URL" ./${MODEL_NAME}
        else
          git clone --depth 1 "https://huggingface.co/$MODEL_URL" ./${MODEL_NAME}
        fi
        ls -la ./${MODEL_NAME}

    - name: Run per-layer sensitivity probe
      run: |
        set -o pipefail
        cd ${{ github.workspace }}
        python scripts/layer_sensitivity_probe.py probe \
          --model models/${{ env.MODEL_NAME }} \
          --calib calib_ifmt.txt \
          --out probe_report.json \
          --n_samples ${{ github.event.inputs.n_samples }} \
          --seq_len ${{ github.event.inputs.seq_len }} \
          --block ${{ github.event.inputs.block }} \
          --modes "${{ github.event.inputs.modes }}" 2>&1 | tee probe_run.log

    - name: Summarize
      run: |
        echo "=== probe report ==="
        python - << 'EOF'
        import json
        r = json.load(open('probe_report.json'))
        whole = r.get("whole", {})
        print("whole-model:", {k: round(v, 5) for k, v in whole.items()})
        for tag in next(iter(r["blocks"].values())):
            errs = sorted(((int(b[5:]), d[tag]) for b, d in r["blocks"].items()), key=lambda x: -x[1])
            print(f"\n[{tag}] blocks by error (worst first):")
            print("  worst5:", [(f"L{b}", round(e, 5)) for b, e in errs[:5]])
            print("  best5: ", [(f"L{b}", round(e, 5)) for b, e in errs[-5:]])
            med = sorted(e for _, e in errs)[len(errs)//2]
            print(f"  median: {med:.5f}")
        EOF

    - name: Upload probe results
      uses: actions/upload-artifact@v4
      with:
        name: probe-${{ env.MODEL_NAME }}-${{ github.run_number }}
        path: |
          probe_report.json
          probe_run.log
        retention-days: 14
        if-no-files-found: error
