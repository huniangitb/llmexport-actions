name: Model Conversion Workflow

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: '模型下载URL (支持任意Git仓库/HuggingFace/压缩包URL)'
        required: true
        default: 'tencent/HY-MT1.5-1.8B'
      export_format:
        description: '导出格式 (例如: mnn)'
        required: true
        default: 'mnn'
      quant_bit:
        description: '量化位数'
        required: true
        default: '4'
      lm_quant_bit:
        description: 'LM Head 层量化位数 (留空则使用 quant_bit 的值)'
        required: false
        default: ''
      quant_block:
        description: '量化块大小'
        required: true
        default: '64'
      quant_algorithm:
        description: '量化算法 (awq/hqq/smooth/无)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'awq'
          - 'hqq'
          - 'smooth'
      symmetric_quant:
        description: '启用对称量化 (--sym)'
        required: false
        default: false
        type: boolean
      generate_for_npu:
        description: 'NPU 导出 (--generate_for_npu, 自动关闭 transformer_c4)'
        required: false
        default: false
        type: boolean
      seperate_embed:
        description: '分离 embedding 为 bf16 (--seperate_embed)'
        required: false
        default: false
        type: boolean
      embed_bit:
        description: 'Embedding 量化位数 (--embed_bit, 留空默认 16/bf16)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '16'
          - '8'
          - '4'
      build_converter:
        description: '编译 MNNConvert 二进制并用于转换 (NPU/HQQ 推荐)'
        required: false
        default: false
        type: boolean
      extra_args:
        description: '自定义参数透传 (原文拼接到 llmexport 命令, 如 --transformer_c4 --act_bit 8)'
        required: false
        default: ''

jobs:
  convert_model:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup system tools
      run: |
        sudo apt-get update
        # 加入 git-lfs 安装以确保支持大文件拉取
        sudo apt-get install -y wget unzip git tree git-lfs
        git lfs install

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Create requirements file
      run: |
        cat > requirements.txt << 'EOF'
        torch
        transformers
        accelerate
        tqdm
        datasets
        sentencepiece
        protobuf
        scipy
        mnn>=3.6.1
        onnx
        onnxslim
        onnxruntime
        peft
        Pillow
        Requests
        yaspin
        numpy
        EOF
        echo "Created requirements.txt with content:"
        cat requirements.txt

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Extract model info
      id: model_info
      env:
        MODEL_URL: ${{ github.event.inputs.model_url }}
      run: |
        set -eo pipefail
        
        if [[ -z "$MODEL_URL" ]]; then
          echo "Error: Empty model URL"
          exit 1
        fi
        
        # 处理HuggingFace模型ID或URL
        if [[ $MODEL_URL != http* ]]; then
          # 如果直接是模型ID (如 tencent/HY-MT1.5-1.8B)
          MODEL_NAME=$(echo "$MODEL_URL" | sed 's/\/$//')
          echo "Source type: HuggingFace Model ID"
        elif [[ $MODEL_URL == *"huggingface.co"* ]]; then
          MODEL_NAME=$(echo "$MODEL_URL" | sed -n 's|.*huggingface\.co/\([^/]\{1,\}/[^/]\{1,\}\).*|\1|p')
          [ -z "$MODEL_NAME" ] && MODEL_NAME=$(echo "$MODEL_URL" | awk -F/ '{print $(NF-1)"/"$NF}')
          echo "Source type: HuggingFace URL"
        elif [[ $MODEL_URL == *.git ]] || [[ $MODEL_URL == *"/tree/"* ]] || [[ $MODEL_URL == *"/blob/"* ]]; then
          MODEL_NAME=$(echo "$MODEL_URL" | awk -F/ '{print $(NF-1)"/"$NF}' | sed 's/\.git$//')
          echo "Source type: Git Repository"
        elif [[ $MODEL_URL == *.zip ]] || [[ $MODEL_URL == *.tar.gz ]] || [[ $MODEL_URL == *.tgz ]]; then
          MODEL_NAME=$(basename "$MODEL_URL" | sed 's/\.[^.]*$//')
          echo "Source type: Archive"
        else
          echo "Warning: Unrecognized URL format, attempting to treat as git repository"
          MODEL_NAME=$(basename "$MODEL_URL" | sed 's/\.git$//')
          echo "Source type: Unknown (treating as git)"
        fi
        
        # 清理模型名称，移除特殊字符
        MODEL_NAME=$(echo "$MODEL_NAME" | sed 's/[\/]/_/g')
        
        echo "Extracted model name: ${MODEL_NAME}"
        echo "MODEL_NAME=${MODEL_NAME}" >> $GITHUB_ENV
        echo "REPO_ID=${MODEL_NAME}" >> $GITHUB_ENV
        echo "model_name=${MODEL_NAME}" >> $GITHUB_OUTPUT

    - name: Configure swap space
      run: |
        sudo swapoff /swapfile || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download model
      env:
        HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        MODEL_URL: ${{ github.event.inputs.model_url }}
      run: |
        set -x
        mkdir -p ${{ github.workspace }}/models
        cd ${{ github.workspace }}/models
        
        download_status=0
        
        # 确保 git lfs 被初始化
        git lfs install
        
        # 检查是否是HuggingFace模型ID
        if [[ $MODEL_URL != http* ]]; then
          echo "Cloning from HuggingFace by model ID using Git LFS: $MODEL_URL"
          if [ -n "$HF_TOKEN" ]; then
            git clone --depth 1 "https://oauth2:${HF_TOKEN}@huggingface.co/$MODEL_URL" ./${{ env.MODEL_NAME }} || download_status=$?
          else
            git clone --depth 1 "https://huggingface.co/$MODEL_URL" ./${{ env.MODEL_NAME }} || download_status=$?
          fi
        elif [[ $MODEL_URL == *"huggingface.co"* ]]; then
          echo "Cloning from HuggingFace URL using Git LFS..."
          REPO_URL="$MODEL_URL"
          # 如果带有 Token 且原链接未包含账号信息，则注入 Token
          if [ -n "$HF_TOKEN" ] && [[ "$REPO_URL" != *"@"* ]]; then
            REPO_PATH=$(echo "$REPO_URL" | sed -n 's|.*huggingface\.co/\(.*\)|\1|p')
            REPO_URL="https://oauth2:${HF_TOKEN}@huggingface.co/${REPO_PATH}"
          fi
          git clone --depth 1 "$REPO_URL" ./${{ env.MODEL_NAME }} || download_status=$?
        elif [[ $MODEL_URL == *.zip ]]; then
          echo "Downloading zip archive..."
          wget -q "$MODEL_URL" -O model.zip && \
          mkdir -p ./${{ env.MODEL_NAME }} && \
          unzip -q model.zip -d ./${{ env.MODEL_NAME }} || download_status=$?
        elif [[ $MODEL_URL == *.tar.gz ]] || [[ $MODEL_URL == *.tgz ]]; then
          echo "Downloading tar archive..."
          wget -q "$MODEL_URL" -O model.tar.gz && \
          mkdir -p ./${{ env.MODEL_NAME }} && \
          tar xzf model.tar.gz -C ./${{ env.MODEL_NAME }} || download_status=$?
        else
          echo "Attempting to clone repository using Git LFS..."
          git clone --depth 1 "$MODEL_URL" ./${{ env.MODEL_NAME }} || download_status=$?
        fi
        
        if [ $download_status -ne 0 ]; then
          echo "Error: Failed to download model"
          exit 1
        fi
        
        if [ ! -d "./${{ env.MODEL_NAME }}" ]; then
          echo "Error: Model directory not found after download"
          ls -la
          exit 1
        fi
        
        echo "Download completed. Model directory contents:"
        ls -la ./${{ env.MODEL_NAME }}

    - name: Checkout MNN export tools
      run: |
        set -eo pipefail
        cd ${{ github.workspace }}
        # PyPI llmexport 包缺少 utils 子模块, 改用 MNN 主线源码中的导出脚本
        git clone --depth 1 https://github.com/alibaba/MNN.git MNN-src
        MNN_COMMIT=$(git -C MNN-src rev-parse --short HEAD)
        echo "MNN_COMMIT=${MNN_COMMIT}" >> $GITHUB_ENV
        ls MNN-src/transformers/llm/export/llmexport.py
        echo "LLMEXPORT_SCRIPT=${{ github.workspace }}/MNN-src/transformers/llm/export/llmexport.py" >> $GITHUB_ENV
        echo "MNNCONVERT_BIN=${{ github.workspace }}/MNN-src/build_convert/MNNConvert" >> $GITHUB_ENV

    - name: Restore MNNConvert from cache release
      id: mnncvt_cache
      if: ${{ github.event.inputs.build_converter == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEST=${{ github.workspace }}/MNN-src/build_convert/MNNConvert
        mkdir -p "$(dirname "$DEST")"
        if gh release download "mnnconvert-cache" -R "$GITHUB_REPOSITORY" \
             -p "MNNConvert-linux-x64-${{ env.MNN_COMMIT }}" -O "$DEST" 2>/dev/null \
           && [ -s "$DEST" ]; then
          chmod +x "$DEST"
          echo "Cache hit: $DEST"
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "Cache miss for MNN commit ${{ env.MNN_COMMIT }}"
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Build MNNConvert (optional)
      if: ${{ github.event.inputs.build_converter == 'true' && steps.mnncvt_cache.outputs.found != 'true' }}
      run: |
        set -eo pipefail
        cd ${{ github.workspace }}
        cmake -B MNN-src/build_convert -S MNN-src \
          -DMNN_BUILD_CONVERTER=ON -DMNN_BUILD_BENCHMARK=OFF \
          -DMNN_BUILD_TEST=OFF -DMNN_BUILD_DEMO=OFF \
          -DMNN_BUILD_QUANTOOLS=OFF -DMNN_SEP_BUILD=OFF \
          -DMNN_BUILD_LLM=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build MNN-src/build_convert --target MNNConvert -j$(nproc)
        ls -lh MNN-src/build_convert/MNNConvert
        echo "MNNCONVERT_BIN=${{ github.workspace }}/MNN-src/build_convert/MNNConvert" >> $GITHUB_ENV

    - name: Upload MNNConvert to cache release
      if: ${{ github.event.inputs.build_converter == 'true' && steps.mnncvt_cache.outputs.found != 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BIN=${{ github.workspace }}/MNN-src/build_convert/MNNConvert
        cp "$BIN" "/tmp/MNNConvert-linux-x64-${{ env.MNN_COMMIT }}"
        gh release create "mnnconvert-cache" --title "MNNConvert binary cache" \
          --notes "Cached MNNConvert linux x64 builds keyed by MNN-src commit." || true
        gh release upload "mnnconvert-cache" \
          "/tmp/MNNConvert-linux-x64-${{ env.MNN_COMMIT }}" --clobber -R "$GITHUB_REPOSITORY"

    - name: Convert model
      run: |
        set -x
        cd ${{ github.workspace }}/models
        
        MODEL_PATH="./${{ env.MODEL_NAME }}"
        if [ ! -d "$MODEL_PATH" ]; then
          echo "Error: Model directory not found: $MODEL_PATH"
          ls -la
          exit 1
        fi
        
        # 构建转换命令 (使用 MNN 主线源码脚本, pip 包缺 utils 模块)
        CONVERT_CMD="python ${{ env.LLMEXPORT_SCRIPT }} --path $MODEL_PATH \
                     --export ${{ github.event.inputs.export_format }} \
                     --quant_bit ${{ github.event.inputs.quant_bit }} \
                     --quant_block ${{ github.event.inputs.quant_block }}"
        
        # 添加 LM Head 层量化位数（如果指定了且不为空）
        if [ -n "${{ github.event.inputs.lm_quant_bit }}" ]; then
          CONVERT_CMD="$CONVERT_CMD --lm_quant_bit ${{ github.event.inputs.lm_quant_bit }}"
          echo "Using separate LM Head quantization: ${{ github.event.inputs.lm_quant_bit }} bits"
        else
          echo "LM Head quantization will use same value as quant_bit: ${{ github.event.inputs.quant_bit }} bits"
        fi
        
        # 添加量化算法选项
        if [ -n "${{ github.event.inputs.quant_algorithm }}" ]; then
          CONVERT_CMD="$CONVERT_CMD --${{ github.event.inputs.quant_algorithm }}"
        fi
        
        # 添加对称量化选项
        if [ "${{ github.event.inputs.symmetric_quant }}" == "true" ]; then
          CONVERT_CMD="$CONVERT_CMD --sym"
        fi

        # NPU 导出
        if [ "${{ github.event.inputs.generate_for_npu }}" == "true" ]; then
          CONVERT_CMD="$CONVERT_CMD --generate_for_npu"
        fi

        # 分离 embedding
        if [ "${{ github.event.inputs.seperate_embed }}" == "true" ]; then
          CONVERT_CMD="$CONVERT_CMD --seperate_embed"
        fi

        # Embedding 量化位数 (留空则默认 16/bf16)
        if [ -n "${{ github.event.inputs.embed_bit }}" ]; then
          CONVERT_CMD="$CONVERT_CMD --embed_bit ${{ github.event.inputs.embed_bit }}"
          echo "Using embed_bit: ${{ github.event.inputs.embed_bit }}"
        fi

        # 使用自编译 MNNConvert 二进制
        if [ "${{ github.event.inputs.build_converter }}" == "true" ]; then
          if [ ! -x "${MNNCONVERT_BIN}" ]; then
            echo "Error: MNNConvert binary not found at ${MNNCONVERT_BIN}"
            exit 1
          fi
          CONVERT_CMD="$CONVERT_CMD --mnnconvert ${MNNCONVERT_BIN}"
        fi

        # 自定义参数透传 (调用者保证引号/空格正确)
        if [ -n "${{ github.event.inputs.extra_args }}" ]; then
          CONVERT_CMD="$CONVERT_CMD ${{ github.event.inputs.extra_args }}"
        fi
        
        # 添加输出路径
        CONVERT_CMD="$CONVERT_CMD --dst_path ./converted"
        
        echo "Running conversion command:"
        echo "$CONVERT_CMD"
        
        # 执行转换
        eval $CONVERT_CMD

        if [ ! -d "./converted" ]; then
          echo "Error: Conversion failed - output directory not created"
          exit 1
        fi
        
        echo "Conversion completed. Output directory contents:"
        ls -la ./converted/

    - name: List converted files
      id: list_files
      run: |
        cd ${{ github.workspace }}/models/converted
        echo "Converted files:"
        ls -la
        
        # 生成文件列表用于release body
        FILE_LIST=$(ls -la)
        echo "file_list<<EOF" >> $GITHUB_ENV
        echo "$FILE_LIST" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: converted-${{ env.MODEL_NAME }}
        path: ${{ github.workspace }}/models/converted/
        retention-days: 7
        if-no-files-found: error

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "release-${{ env.MODEL_NAME }}-${{ github.run_number }}"
        name: "${{ env.MODEL_NAME }} ${{ github.event.inputs.export_format }} Model"
        body: |
          Conversion Details:
          - Source: ${{ github.event.inputs.model_url }}
          - Format: ${{ github.event.inputs.export_format }}
          - Quantization: ${{ github.event.inputs.quant_bit }}bit
          - LM Head Quant: ${{ github.event.inputs.lm_quant_bit || 'Same as quant_bit' }}
          - Block Size: ${{ github.event.inputs.quant_block }}
          - Quant Algorithm: ${{ github.event.inputs.quant_algorithm || 'None' }}
          - Symmetric Quant: ${{ github.event.inputs.symmetric_quant }}
          - Generate for NPU: ${{ github.event.inputs.generate_for_npu }}
          - Seperate Embed: ${{ github.event.inputs.seperate_embed }}
          - Embed Bit: ${{ github.event.inputs.embed_bit || 'default (16/bf16)' }}
          - Built MNNConvert: ${{ github.event.inputs.build_converter }}
          - Extra Args: ${{ github.event.inputs.extra_args || 'None' }}
          - Build: ${{ github.run_number }}
          
          Converted Files:
          ```
          ${{ env.file_list }}
          ```
        files: |
          ${{ github.workspace }}/models/converted/**
        draft: false
        prerelease: false

    - name: Cleanup resources
      if: always()
      run: |
        sudo swapoff /swapfile || true
        df -h
        sudo rm -f /swapfile || true
        rm -rf ${{ github.workspace }}/models
